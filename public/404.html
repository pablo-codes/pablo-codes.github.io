<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Francis Okpani</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // If hosted on a custom domain (e.g. francisokpani.com) or username.github.io, set pathSegmentsToKeep to 0.
      // If hosted on username.github.io/repo-name, set pathSegmentsToKeep to 1.
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '/?/' + l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <!-- Redirecting... -->
  </body>
</html>
